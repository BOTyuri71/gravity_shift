    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10121e" />
    <meta
      name="description"
      content="Gravity Shift — um botão, duas gravidades. Sobrevive o máximo possível."

  <body>
    <main class="app">
      <header class="header">
        <h1>GRAVITY SHIFT</h1>
